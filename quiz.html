<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container" id="quiz-container">
        <div class="round-photo2">
            <img src="mihir's webpink.png" alt="Mihir Patel">
        </div>
        <div id="quiz">
            <h2 class="glitch" data-text="MEMORY_CHECK">MEMORY_CHECK</h2>

            <div class="progress-container">

            <div id="quiz-options">

                <button id="bt3"><span id="choice3"></span></button>

            <hr>
        </div>

    <div class="footer">
        <p>&copy; <span id="yearDisplay"></span> All Rights Reserved By <a href="https://www.instagram.com/mihiiirpatel/">Mihir Patel</a>.</p>

    <script>document.getElementById("yearDisplay").innerText = new Date().getFullYear();</script>
